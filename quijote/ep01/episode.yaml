title: "DON QUIJOTE — Episodio uno: El ingenioso hidalgo"
output: "episode_01.mp3"

# Generar voces:  podcastkit generate -e quijote/ep01
# Montar (frame NOTED):  python3 tools/assemble.py --series quijote --episode 1
# Montar (sin frame):    podcastkit assemble -e quijote/ep01
#
# Voces en español vía Chatterbox multilingüe (local, clona voz desde un clip).
# voice_id: ""  usa la voz por defecto del modelo. Para una voz propia por
# personaje, apunta a un WAV de referencia, p.ej. voices_ref/quijote.wav.
voices:
  NARRADOR:
    backend: chatterbox
    voice_id: ""            # ref clip → voz documental, seca; p.ej. voices_ref/narrador.wav
    model_id: multilingual
    settings: {language_id: es, exaggeration: 0.40, cfg_weight: 0.50, temperature: 0.70}
  QUIJOTE:
    backend: chatterbox
    voice_id: ""            # ref clip → voz mayor, grave, exaltada; p.ej. voices_ref/quijote.wav
    model_id: multilingual
    settings: {language_id: es, exaggeration: 0.85, cfg_weight: 0.50, temperature: 0.80}
  SANCHO:
    backend: chatterbox
    voice_id: ""            # ref clip → voz llana, terrenal; p.ej. voices_ref/sancho.wav
    model_id: multilingual
    settings: {language_id: es, exaggeration: 0.60, cfg_weight: 0.45, temperature: 0.85}

# pre_silence = segundos de silencio antepuestos a cada línea.
